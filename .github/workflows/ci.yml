name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The example projects, sharded across runners.
  #
  # This loop is the long pole of the whole run. Measured on the native leg of
  # the job this replaces: 19m56s of a 22m46s job, i.e. 87%, was the loop --
  # every example is its own moon module, so each one rebuilds the entire
  # dependency closure from scratch. The workspace check/test that used to sit
  # in front of the loop moved out entirely: the `js` and `native-macos` jobs
  # below already ran the identical commands.
  #
  # The two targets get different shard counts because the work is shaped
  # differently. js tests 33 projects at a flat ~19s each (measured; max 39s, so
  # round-robin splits it to within ~20% without a per-project cost table).
  # native tests only 11 -- anything linking wgpu-native is check-only there --
  # but at ~1.6m each. Past 4 shards native stops improving, since ceil(11/4)
  # and ceil(11/5) are both 3, and macOS minutes bill at 10x.
  examples:
    name: examples (${{ matrix.target }} ${{ matrix.shard }}/${{ matrix.shard_total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: js, shard: 1, shard_total: 3 }
          - { os: ubuntu-latest, target: js, shard: 2, shard_total: 3 }
          - { os: ubuntu-latest, target: js, shard: 3, shard_total: 3 }
          - { os: macos-latest, target: native, shard: 1, shard_total: 4 }
          - { os: macos-latest, target: native, shard: 2, shard_total: 4 }
          - { os: macos-latest, target: native, shard: 3, shard_total: 4 }
          - { os: macos-latest, target: native, shard: 4, shard_total: 4 }
    runs-on: ${{ matrix.os }}
    env:
      MOON_CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@just
      # scripts/example-projects.mjs decides which projects this shard owns, so
      # pin the Node that runs it rather than taking the runner image default.
      # No pnpm: the shards need no JS dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Update MoonBit registry
        run: moon update
      - name: Setup wgpu-native and glfw
        if: matrix.target == 'native'
        run: |
          bash scripts/setup-wgpu-native.sh
          echo "CPATH=$(brew --prefix glfw)/include:/usr/local/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Check examples
        run: just target=${{ matrix.target }} check-examples ${{ matrix.shard }}/${{ matrix.shard_total }}
      - name: Test examples
        run: just target=${{ matrix.target }} test-examples ${{ matrix.shard }}/${{ matrix.shard_total }}

  # The JS-side unit tests and the release manifest check. These ran in the old
  # check-test-matrix js leg; they belong here rather than in a shard, so they
  # run once instead of three times.
  js-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Test JS scripts
        run: node --test scripts/*.test.mjs
      - name: Test web libs
        run: node --test assets/web/*.test.mjs
      - name: Release manifest check
        run: |
          node scripts/check-moon-release.mjs
          node scripts/prepare-moon-release.mjs --dry-run

  wasm-guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@just
      - name: Setup pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: examples/experimental/wasm_game/host/pnpm-lock.yaml
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Update MoonBit registry
        run: moon update
      - name: Verify WASM guests
        run: just wasm-verify

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Setup pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install E2E deps
        run: pnpm install --frozen-lockfile
      - name: Update MoonBit registry
        run: moon update
      - name: Format
        run: |
          moon fmt
          git diff --exit-code
      - name: Check
        run: moon check --deny-warn --target js
      - name: Test
        run: moon test --target js
      - name: Inspection release artifact gate
        run: node scripts/check-inspection-release.mjs js
      - name: Coverage Analysis
        run: bash scripts/check-coverage.sh js
      - name: Runtime Smoke (JS)
        run: cd examples/smoke/runtime_smoke && moon run . --target js
      - name: Frame VRT (browser-free visual regression)
        # A real gate, unlike the Playwright VRT below. The frames come from
        # the engine's headless path through the CPU rasterizer, so they need
        # no GPU and no browser and are byte-identical run to run -- which is
        # exactly what the canvas capture and the Dawn readback cannot give us
        # on Linux. Runs before the Playwright install so a visual regression
        # is reported without waiting on a browser download.
        run: node scripts/frame-vrt.mjs
      - name: Canvas UI interaction gate
        run: node scripts/ui-interactions.mjs ui_demo
      - name: Canvas UI transition gate
        run: |
          node scripts/ui-flipbook.mjs ui_demo focus
          node scripts/ui-flipbook.mjs ui_demo hover
      - name: Capture fixture release artifact gate
        run: node scripts/check-capture-release.mjs js
      - name: Canvas UI state and viewport matrix
        run: node scripts/ui-matrix.mjs ui_demo
      - name: Install Playwright Browser
        # `--with-deps` runs `sudo apt-get`; on Ubuntu 24.04 the needrestart
        # post-install hook prompts and hangs. sudo resets the env, so set the
        # conf file to force auto-restart (no prompt). The separate "download
        # hangs at 100%" symptom was a Node 24.16+ x Playwright <1.60 yauzl
        # extraction bug (microsoft/playwright#41092), fixed by the 1.60 bump
        # in package.json. Keep a timeout as a safety net.
        timeout-minutes: 10
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/99-ci-autorestart.conf >/dev/null
          pnpm exec playwright install --with-deps chromium
      - name: Runtime Smoke E2E (wasm/wasm-gc)
        run: pnpm e2e:smoke
      - name: VRT E2E (visual regression)
        # macOS Metal presents a transparent canvas, so vrt.spec.ts gates on the
        # GPU readback coverage there (a real gate). The Linux CI runner cannot
        # capture the rendered frame at all: the canvas screenshot is also
        # transparent (verified: generated -linux baselines were fully blank),
        # AND the readback summary never arrives (copyTextureToBuffer + mapAsync
        # do not complete on the Linux Dawn backend — readback enabled, summary
        # never set). So neither a screenshot nor a readback gate is possible on
        # Linux yet; --update-snapshots keeps it green (non-gating) until the
        # Dawn readback is fixed. Tracked for follow-up.
        run: pnpm exec playwright test e2e/vrt.spec.ts --update-snapshots
      - name: API Info
        run: moon info

  native-linux:
    runs-on: ubuntu-latest
    env:
      MOON_CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev clang libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxxf86vm-dev libasound2-dev
      - name: Ensure /usr/bin/cc is clang
        run: sudo ln -sf "$(which clang)" /usr/bin/cc
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Setup wgpu-native
        run: |
          bash scripts/setup-wgpu-native.sh
          echo "CPATH=/usr/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Check
        run: moon check --target native
      - name: Test
        run: moon test --target native
      - name: Build Native Triangle
        run: cd examples/smoke/native_triangle && moon build . --target native

  native-windows:
    runs-on: windows-latest
    env:
      KAGURA_WGPU_WINDOWS_TOOLCHAIN: msvc
      VCPKG_INSTALLED_DIR: C:\vcpkg\installed
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install MoonBit CLI
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - name: Install GLFW headers (vcpkg)
        run: vcpkg install glfw3:x64-windows-static
      - name: Setup wgpu-native
        shell: bash
        run: |
          bash scripts/setup-wgpu-native.sh
          echo "LIBRARY_PATH=$(pwd)/deps/wgpu-native/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          # moon test compiles the glfw stub (.c); cc-flags from deps do not
          # propagate, so expose the vcpkg GLFW headers via CPATH (clang reads
          # it). Single entry to avoid the drive-letter/separator ambiguity.
          echo "CPATH=${VCPKG_INSTALLED_DIR//\\//}/${VCPKG_DEFAULT_TRIPLET}/include" >> "$GITHUB_ENV"
      - name: Setup Windows native build
        shell: bash
        run: bash scripts/setup-windows-native.sh
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target native
      - name: Test
        run: moon test --target native
      - name: Build Native Triangle
        run: cd examples/smoke/native_triangle && moon build . --target native

  native-macos:
    runs-on: macos-latest
    env:
      # moonbit doesn't propagate cc-flags from dependency packages,
      # so GLFW headers must be discoverable via system include paths
      CPATH: /opt/homebrew/include:/usr/local/include
      LIBRARY_PATH: /opt/homebrew/lib:/usr/local/lib
    steps:
      - uses: actions/checkout@v4
      - name: Checkout terrain path dependency
        run: git clone --depth=1 https://github.com/mizchi/terrain.git ../terrain
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: Install verification tools
        run: pnpm install --frozen-lockfile
      - name: Update MoonBit registry
        run: moon update
      - name: Setup wgpu-native and glfw
        run: bash scripts/setup-wgpu-native.sh
      # --deny-warn used to come from the check-test-matrix native leg, which no
      # longer runs the workspace check. Keep it here so native warnings still
      # fail the build.
      - name: Inspection release artifact gate
        run: node scripts/check-inspection-release.mjs native
      - name: Check
        run: moon check --deny-warn --target native
      - name: Test
        run: moon test --target native
      - name: Native capture fixture release artifact gate
        run: node scripts/check-capture-release.mjs native
      - name: Native UI capture contracts
        run: node scripts/ui-capture-native.integration.mjs
      - name: Native UI matrix against shared JS baselines
        run: node scripts/ui-matrix.mjs ui_demo --backend native --no-build
      - name: Runtime Smoke Build (Native)
        run: cd examples/smoke/runtime_smoke_native && moon build . --target native
      - name: Build Native Triangle
        run: cd examples/smoke/native_triangle && moon build . --target native
