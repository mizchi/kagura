<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kagura example</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121a23;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        outline: none;
      }
      #error {
        position: absolute;
        background: #321b25;
        color: #fff;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="app" tabindex="0" aria-label="Example game"></canvas>
    <p id="error" hidden></p>
    <script type="module" src="./runtime.mjs"></script>
  </body>
</html>
